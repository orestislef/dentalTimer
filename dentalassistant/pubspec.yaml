name: dentalassistant
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  vibration: ^3.2.1
  flutter_local_notifications: ^22.3.3
  audioplayers: ^6.8.1
  permission_handler: ^12.0.3
  circular_countdown_timer: ^0.2.4
  http: ^1.6.0
  shared_preferences: ^2.5.6
  easy_localization: ^3.0.8
  toggle_switch: ^2.3.0
  duration_picker: ^2.0.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sound/
    - assets/translations/
    - assets/images/