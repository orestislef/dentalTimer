name: dentalassistant
description: "A new Lefkaditis project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  vibration: ^3.1.3
  flutter_local_notifications: ^19.0.0
  audioplayers: ^6.4.0
  permission_handler: ^11.4.0
  circular_countdown_timer: ^0.2.4
  http: ^1.3.0
  shared_preferences: ^2.5.2
  easy_localization: ^3.0.7+1
  toggle_switch: ^2.3.0
  duration_picker: ^1.2.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sound/
    - assets/translations/